name: Release assets

on:
  workflow_dispatch:
    inputs:
      version:
        description: Exact manifest version
        required: true

concurrency:
  group: release-${{ inputs.version }}
  cancel-in-progress: false

permissions:
  attestations: write
  contents: write
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run verify:release
      - name: Require main branch
        if: github.ref != 'refs/heads/main'
        run: |
          echo "Releases must be created from main." >&2
          exit 1
      - name: Verify requested version
        env:
          REQUESTED_VERSION: ${{ inputs.version }}
        run: test "$(node -p 'require("./manifest.json").version')" = "$REQUESTED_VERSION"
      - name: Attest release assets
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          create-storage-record: false
          subject-path: |
            main.js
            manifest.json
            styles.css
      - name: Publish release assets
        env:
          GH_TOKEN: ${{ github.token }}
          REQUESTED_VERSION: ${{ inputs.version }}
        run: |
          if gh release view "$REQUESTED_VERSION" >/dev/null 2>&1; then
            gh release upload "$REQUESTED_VERSION" \
              main.js manifest.json styles.css \
              --clobber
          else
            gh release create "$REQUESTED_VERSION" \
              --draft \
              --generate-notes \
              --target "$GITHUB_SHA" \
              main.js manifest.json styles.css
          fi
